name: refresh profile

on:
  schedule:
    # Six-hourly, off the hour: scheduled runs cluster on :00 and get queued.
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/**'
      - '.github/workflows/refresh.yml'

permissions:
  contents: write

# A scheduled run and a push run committing at once would race each other.
concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pull the numbers
        run: node scripts/fetch.mjs
        env:
          # A PAT with public read keeps the star curve fresh. Without the
          # secret the run still succeeds on the built-in token; the curve
          # just holds its last committed shape.
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Draw the panels
        run: node scripts/render.mjs

      - name: Commit if anything actually moved
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets data README.md
          if git diff --quiet --cached; then
            echo 'nothing changed'
            exit 0
          fi
          git commit -m 'chore: refresh profile from live data'
          git push
